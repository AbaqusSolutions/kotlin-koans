buildscript {
    ext.kotlin_version = '2.2.10'

    repositories {
        mavenCentral()
        
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

def printOutput(def output) {
    return tasks.create("printOutput") {
        for (line in output.toString().readLines()) {
            println "#educational_plugin" + line
        }
    }
}

subprojects {
    apply plugin: 'application'
    apply plugin: 'java'
    apply plugin: 'kotlin'

    repositories {
        mavenCentral()
        
    }

    dependencies {
        testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    }

    kotlin {
        jvmToolchain(17)
    }

    // With a comma in the build path (the "Hello, world!" task), compileTestKotlin can't see the task's own code.
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(project.name.replaceAll('[^A-Za-z0-9_-]', '_'))

    sourceSets {
        main {
            kotlin.srcDir 'src'
            java.srcDir 'src'
        }
        test {
            kotlin.srcDir 'test'
            java.srcDir 'test'
        }
    }

    // The tour tests call the task's main() through ExerciseUtils, so it has to compile with each task.
    if (projectDir.toPath().startsWith(rootProject.file('tour').toPath()) && file('test').exists()) {
        sourceSets.test.kotlin.srcDir rootProject.file('tour/test-support')
        dependencies {
            testImplementation "org.jetbrains.kotlin:kotlin-test-junit"
        }
    }

    if (project.hasProperty("mainClass")) {
        application.mainClass = project.getProperty("mainClass")
    }

    def runOutput = new ByteArrayOutputStream()
    tasks.run.setStandardOutput(runOutput)
    tasks.run.doLast { printOutput(runOutput) }
}

project(':util') {
    dependencies {
        implementation group: 'junit', name: 'junit', version: '4.13.2'
    }
}

def util = project(':util')

configure(subprojects.findAll {it.name != 'util'}) {
  dependencies {
    implementation util.sourceSets.main.output
    testImplementation util.sourceSets.test.output
  }
}
